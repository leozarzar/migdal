<body>

<div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            WCM
        </div>

        <div class="sidebar-section-label">Análises</div>

        <button onclick="showScreen('dashboard')">
            Dashboard
        </button>

        <button onclick="showScreen('stock-monitor')">
            Monitor de Estoque
        </button>

        <button onclick="showScreen('consumption-stats')">
            Estat. de Consumo
        </button>

        <button onclick="showScreen('stock-policies')">
            Política de Estoque
        </button>

        <div class="sidebar-section-label">Operacional</div>

        <button onclick="showScreen('stock-units')">
            Estoque
        </button>

        <button onclick="showScreen('orders')">
            Pedidos
        </button>

        <button onclick="showScreen('receipts')">
            Recebimentos
        </button>

        <div class="sidebar-section-label">Cadastros</div>

        <button onclick="showScreen('materials')">
            Materiais
        </button>

        <button onclick="showScreen('suppliers')">
            Fornecedores
        </button>

        <button onclick="showScreen('operators')">
            Operadores
        </button>

        <button onclick="showScreen('groups')">
            Grupos
        </button>

    </div>


    <!-- MAIN -->

    <div class="main">

        <div class="header">

            <div id="headerTitle">
                Bags
            </div>

            <div id="headerOptionsContent">
            </div>

        </div>


        <div id="content" class="content">

            <!-- telas vão aparecer aqui -->

        </div>

    </div>

</div>
