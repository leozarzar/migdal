<body>

<!-- Banner exibido em telas pequenas — redireciona para o app mobile -->
<div class="mobile-redirect-banner" role="alert" aria-live="polite">
    <span class="mobile-redirect-banner__icon material-symbols-outlined">smartphone</span>
    <p class="mobile-redirect-banner__title">Use o app mobile</p>
    <p class="mobile-redirect-banner__subtitle">Esta versão foi projetada para uso em computador. Para dispositivos móveis, acesse o app dedicado.</p>
    <a class="mobile-redirect-banner__btn" href="/mobile/login">Ir para o app mobile</a>
</div>


<div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            <img class="logo-img" src="resources/logo-full-dark-background.png" alt="WCM">
        </div>

        <!-- Filtro global de centro de estoque -->
        <div class="sidebar-location-filter">
            <span class="material-symbols-outlined sidebar-location-filter-icon">warehouse</span>
            <select id="sidebarLocationSelect" class="sidebar-location-select" onchange="AppState.setLocationFilter(this.value)">
                <option value="">Todos</option>
            </select>
        </div>

        <!-- Navegação gerada dinamicamente por _renderSidebar() em app.js -->
        <nav id="sidebarNav" class="sidebar-nav"></nav>

        <!-- Usuário logado -->
        <div class="sidebar-user-section">
            <button class="sidebar-user" title="Perfil do usuário" disabled>
                <div class="sidebar-user-avatar" id="sidebarUserAvatar">
                    <img class="sidebar-user-avatar-img" id="sidebarUserAvatarImg" alt="" hidden>
                    <span class="sidebar-user-avatar-initials" id="sidebarUserAvatarInitials"></span>
                </div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name" id="sidebarUserName"></span>
                    <span class="sidebar-user-email" id="sidebarUserEmail"></span>
                </div>
            </button>
        </div>

        <!-- Logout -->
        <button class="sidebar-settings" onclick="appLogout()" title="Sair">
            <span class="material-symbols-outlined">logout</span>
            Log out
        </button>

        <!-- Configurações -->
        <button class="sidebar-settings" title="Configurações">
            <span class="material-symbols-outlined">settings</span>
            Configurações
        </button>

    </div>


    <!-- MAIN -->

    <div class="main">

        <div class="header">

            <div class="header-tabs" id="headerTabs"></div>

            <button id="notifBell" class="notif-bell" onclick="NotificationsManager.togglePanel()" title="Notificações">
                <span class="material-symbols-outlined">notifications</span>
                <span class="notif-badge" id="notifBadge" hidden></span>
            </button>

            <div id="headerOptionsContent"></div>

        </div>


        <div id="content" class="content">

            <!-- telas vão aparecer aqui -->

        </div>

    </div>

</div>
