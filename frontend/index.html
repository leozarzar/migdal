<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WCM App</title>

    <link rel="stylesheet" href="desktop/style.css">
    <link rel="stylesheet" href="desktop/components/search-select-style.css">
    <link rel="stylesheet" href="desktop/components/number-input-style.css">
    <link rel="stylesheet" href="desktop/screens/stock-units-style.css">
    <link rel="stylesheet" href="desktop/screens/orders-style.css">
    <link rel="stylesheet" href="desktop/screens/orders-details-style.css">
    <link rel="stylesheet" href="desktop/screens/receipts-style.css">
    <link rel="stylesheet" href="desktop/screens/receipts-details-style.css">
    <link rel="stylesheet" href="desktop/screens/materials-style.css">
    <link rel="stylesheet" href="desktop/screens/suppliers-style.css">
    <link rel="stylesheet" href="desktop/screens/operators-style.css">
    <link rel="stylesheet" href="desktop/screens/dashboard-style.css">
    <link rel="stylesheet" href="desktop/screens/stock-monitor-style.css">
    <link rel="stylesheet" href="desktop/screens/consumption-stats-style.css">
    <link rel="stylesheet" href="desktop/screens/stock-policies-style.css">
    <link rel="stylesheet" href="desktop/screens/stock-policies-details-style.css">
    <link rel="stylesheet" href="desktop/screens/groups-style.css">
    <link rel="stylesheet" href="desktop/screens/groups-details-style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

</head>

<body>

<!-- Banner exibido em telas pequenas — redireciona para o app mobile -->
<div class="mobile-redirect-banner" role="alert" aria-live="polite">
    <span class="mobile-redirect-banner__icon material-symbols-outlined">smartphone</span>
    <p class="mobile-redirect-banner__title">Use o app mobile</p>
    <p class="mobile-redirect-banner__subtitle">Esta versão foi projetada para uso em computador. Para dispositivos móveis, acesse o app dedicado.</p>
    <a class="mobile-redirect-banner__btn" href="/mobile/">Ir para o app mobile</a>
</div>

<div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            WCM
        </div>

        <div class="sidebar-section-label">Análises</div>

        <button data-route="dashboard" onclick="showScreen('dashboard')">
            <span class="material-symbols-outlined">dashboard</span>
            Dashboard
        </button>

        <button data-route="stock-monitor" onclick="showScreen('stock-monitor')">
            <span class="material-symbols-outlined">monitoring</span>
            Monitor de Estoque
        </button>

        <button data-route="consumption-stats" onclick="showScreen('consumption-stats')">
            <span class="material-symbols-outlined">bar_chart</span>
            Estat. de Consumo
        </button>

        <button data-route="stock-policies" onclick="showScreen('stock-policies')">
            <span class="material-symbols-outlined">policy</span>
            Política de Estoque
        </button>

        <div class="sidebar-section-label">Operacional</div>

        <button data-route="stock-units" onclick="showScreen('stock-units')">
            <span class="material-symbols-outlined">inventory_2</span>
            Estoque
        </button>

        <button data-route="orders" onclick="showScreen('orders')">
            <span class="material-symbols-outlined">shopping_cart</span>
            Pedidos
        </button>

        <button data-route="receipts" onclick="showScreen('receipts')">
            <span class="material-symbols-outlined">move_to_inbox</span>
            Recebimentos
        </button>

        <div class="sidebar-section-label">Cadastros</div>

        <button data-route="materials" onclick="showScreen('materials')">
            <span class="material-symbols-outlined">category</span>
            Materiais
        </button>

        <button data-route="suppliers" onclick="showScreen('suppliers')">
            <span class="material-symbols-outlined">store</span>
            Fornecedores
        </button>

        <button data-route="operators" onclick="showScreen('operators')">
            <span class="material-symbols-outlined">badge</span>
            Operadores
        </button>

        <button data-route="groups" onclick="showScreen('groups')">
            <span class="material-symbols-outlined">folder</span>
            Grupos
        </button>

    </div>


    <!-- MAIN -->

    <div class="main">

        <div class="header">

            <div id="headerTitle">
                Bags
            </div>

            <div id="headerOptionsContent">
            </div>

        </div>


        <div id="content" class="content">

            <!-- telas vão aparecer aqui -->

        </div>

    </div>

</div>


<script src="utils.js"></script>
<script src="stock-policy-utils.js"></script>
<script src="canvas-chart-utils.js"></script>
<script src="desktop/components/search-select.js"></script>
<script src="desktop/components/number-input.js"></script>
<script src="desktop/screens/stock-units.js"></script>
<script src="desktop/screens/orders.js"></script>
<script src="desktop/screens/orders-details.js"></script>
<script src="desktop/screens/receipts.js"></script>
<script src="desktop/screens/receipts-details.js"></script>
<script src="desktop/screens/materials.js"></script>
<script src="desktop/screens/suppliers.js"></script>
<script src="desktop/screens/operators.js"></script>
<script src="desktop/screens/dashboard.js"></script>
<script src="desktop/screens/stock-monitor.js"></script>
<script src="desktop/screens/consumption-stats.js"></script>
<script src="desktop/screens/stock-policies.js"></script>
<script src="desktop/screens/stock-policies-details.js"></script>
<script src="desktop/screens/groups.js"></script>
<script src="desktop/screens/groups-details.js"></script>
<script src="desktop/app.js"></script>

</body>

</html>
